<style>
  .uvt-wrap{padding:20px;font-family:system-ui,sans-serif;}
  .uvt-title{text-align:center;margin-bottom:30px;font-size:20px;font-weight:600;color:#333;}
  .uvt-title em{background:linear-gradient(135deg,#5b7b5e,#a7bda0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px;font-weight:700;font-style:normal;}
  .uvt-table{width:100%;max-width:800px;margin:0 auto;border-spacing:0;border-radius:16px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,.1);background:#ffffff;font-size:15px;}
  .uvt-table thead{background:linear-gradient(135deg,#5b7b5e,#a7bda0);color:#ffffff;text-transform:uppercase;letter-spacing:.5px;font-size:14px;}
  .uvt-table th{padding:16px;text-align:left;}
  .uvt-table th:not(:first-child){text-align:center;}
  .uvt-table td{padding:14px;border-bottom:1px solid #ddd;color:#333333;}
  .uvt-table td:not(:first-child){text-align:center;}
  .uvt-table tr:nth-child(even) td{background:#f7f7f7;}
  .uvt-check{color:#4CAF50;font-weight:bold;font-size:18px;}
  .uvt-cross{color:#e53935;font-weight:bold;font-size:18px;}
  @media(max-width:600px){.uvt-table{font-size:13px;}.uvt-table th,.uvt-table td{padding:10px;}}
</style>
<div class="uvt-wrap">
  <p class="uvt-title">Why do our customers <em>Love our Candles</em> ?</p>
  <table class="uvt-table">
    <thead>
      <tr>
        <th>Features</th>
        <th>The Scented Market</th>
        <th>Other Candles</th>
      </tr>
    </thead>
    <tbody>
      <tr><td><strong>100% Soy Wax</strong></td><td><span class="uvt-check">✓</span></td><td><span class="uvt-cross">✗</span></td></tr>
      <tr><td><strong>Vegan Friendly</strong></td><td><span class="uvt-check">✓</span></td><td><span class="uvt-cross">✗</span></td></tr>
      <tr><td><strong>Phthalate & Paraben Free</strong></td><td><span class="uvt-check">✓</span></td><td><span class="uvt-cross">✗</span></td></tr>
      <tr><td><strong>Hand Poured in Canada</strong></td><td><span class="uvt-check">✓</span></td><td><span class="uvt-cross">✗</span></td></tr>
      <tr><td><strong>Safe Around Children & Pets</strong></td><td><span class="uvt-check">✓</span></td><td><span class="uvt-cross">✗</span></td></tr>
    </tbody>
  </table>
</div>
